<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#0b0b12"/>
<rect x="30" y="30" width="1140" height="640" fill="none" stroke="#b56cff" stroke-width="3"/>
<text x="60" y="74" font-family="monospace" font-size="25" fill="#4ffff3">PROOF / SOURCE MAP</text>
<text x="60" y="106" font-family="monospace" font-size="21" fill="#e8d7ff">Koskotas scandal and media-bank-political triangle</text>
<text x="70" y="135" font-family="monospace" font-size="20" fill="#ffffff">1. The Koskotas scandal connected banking, media power, party politics, and</text><text x="70" y="162" font-family="monospace" font-size="20" fill="#ffffff">   allegations of corruption in late-1980s Greece.</text><text x="70" y="199" font-family="monospace" font-size="20" fill="#ffffff">2. The case reshaped the political climate and fed a period of trials,</text><text x="70" y="226" font-family="monospace" font-size="20" fill="#ffffff">   polarization, and institutional suspicion.</text><text x="70" y="263" font-family="monospace" font-size="20" fill="#ffffff">3. The main conflict was whether media and financial machinery were being</text><text x="70" y="290" font-family="monospace" font-size="20" fill="#ffffff">   used to purchase influence.</text><text x="70" y="327" font-family="monospace" font-size="20" fill="#ffffff">4. It matters because it showed how press power and banking power can merge</text><text x="70" y="354" font-family="monospace" font-size="20" fill="#ffffff">   into political leverage.</text><text x="70" y="391" font-family="monospace" font-size="20" fill="#ffffff">5. Public trust suffered because the scandal suggested that money,</text><text x="70" y="418" font-family="monospace" font-size="20" fill="#ffffff">   publicity, and state access could form a closed circuit.</text><text x="70" y="455" font-family="monospace" font-size="20" fill="#ffffff">6. Open questions concern the full map of beneficiaries and the boundary</text><text x="70" y="482" font-family="monospace" font-size="20" fill="#ffffff">   between legal influence and criminal corruption.</text><text x="70" y="519" font-family="monospace" font-size="20" fill="#ffffff">7. Greek historical political record.</text><text x="70" y="556" font-family="monospace" font-size="20" fill="#ffffff">8. Court and parliamentary references around the Koskotas affair.</text>
<text x="60" y="645" font-family="monospace" font-size="16" fill="#aaaaaa">Use this as a reading map, not as standalone proof.</text>
</svg>