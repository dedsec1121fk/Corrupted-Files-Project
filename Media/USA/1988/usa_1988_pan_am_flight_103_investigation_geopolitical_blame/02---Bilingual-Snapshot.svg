0">ΤΙΤΛΟΣ EL</text><text x="116" y="285" fill="#f5f7fb" font-family="monospace" font-size="30" font-weight="700">Pan Am Flight 103 investigation</text><text x="116" y="322" fill="#f5f7fb" font-family="monospace" font-size="30" font-weight="700">and geopolitical blame</text><text x="862" y="285" fill="#f5f7fb" font-family="monospace" font-size="28" font-weight="700">Pan Am Flight 103 investigation and</text><text x="862" y="320" fill="#f5f7fb" font-family="monospace" font-size="28" font-weight="700">geopolitical blame [EL review</text><text x="862" y="355" fill="#f5f7fb" font-family="monospace" font-size="28" font-weight="700">needed]</text><rect x="92" y="385" width="670" height="308" rx="14" fill="#0d1016" stroke="#394255" stroke-width="1.5"/><rect x="838" y="385" width="670" height="308" rx="14" fill="#0d1016" stroke="#394255" stroke-width="1.5"/><text x="116" y="420" fill="#b78cff" font-family="monospace" font-size="22" font-weight="700">EN SUMMARY</text><text x="862" y="420" fill="#8affc1" font-family="monospace" font-size="22" font-weight="700">ΣΥΝΟΨΗ EL</text><text x="116" y="460" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">Pan Am Flight 103 investigation and</text><text x="116" y="490" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">geopolitical blame became a major public-trust</text><text x="116" y="520" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">case because it combined institutional power,</text><text x="116" y="550" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">vulnerable people, information control, and</text><text x="116" y="580" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">later arguments over who benefited and who was</text><text x="116" y="610" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">protected.</text><text x="862" y="460" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">Η υπόθεση Pan Am Flight 103 investigation and</text><text x="862" y="490" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">geopolitical blame μπήκε στον δημόσιο διάλογο</text><text x="862" y="520" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">επειδή συνδύασε θεσμική ισχύ, ευάλωτους</text><text x="862" y="550" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">ανθρώπους, έλεγχο πληροφορίας και</text><text x="862" y="580" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">μεταγενέστερη σύγκρουση για το ποιος ωφελήθηκε</text><text x="862" y="610" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">και ποιος προστατεύτηκε.</text><rect x="92" y="722" width="1416" height="120" rx="14" fill="#0d1016" stroke="#b78cff" stroke-width="1.5"/><text x="116" y="756" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="700">TIMELINE / ΧΡΟΝΟΛΟΓΙΟ</text><text x="116" y="792" fill="#8affc1" font-family="monospace" font-size="19" font-weight="400">• No timeline points were extracted automatically.</text><text x="92" y="874" fill="#9aa4b2" font-family="monospace" font-size="16">Generated from project text for offline reference. No external copyrighted news image copied. ID: usa_1988_pan_am_flight_103_investigation_geopolitical_blame</text></svg>