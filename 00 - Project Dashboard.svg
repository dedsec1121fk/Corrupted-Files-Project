ece: 199</text><text x="564" y="317" fill="#f5f7fb" font-family="monospace" font-size="24" font-weight="400">USA: 244</text><rect x="988" y="240" width="520" height="235" rx="14" fill="#0d1016" stroke="#b78cff" stroke-width="1.5"/><text x="1008" y="272" fill="#b78cff" font-family="monospace" font-size="22" font-weight="700">QUALITY OVERVIEW</text><text x="1012" y="285" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">Translation good: 318</text><text x="1012" y="314" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">Translation needs review: 125</text><text x="1012" y="343" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">Sources generic-guidance: 428</text><text x="1012" y="372" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">Sources specific-links: 11</text><text x="1012" y="401" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">Sources descriptive-no-links: 4</text><rect x="92" y="510" width="650" height="290" rx="14" fill="#0d1016" stroke="#8affc1" stroke-width="1.5"/><text x="112" y="542" fill="#8affc1" font-family="monospace" font-size="22" font-weight="700">TOP CATEGORIES</text><text x="116" y="555" fill="#f5f7fb" font-family="monospace" font-size="24" font-weight="700">1. public trust / accountability (112)</text><text x="116" y="593" fill="#f5f7fb" font-family="monospace" font-size="24" font-weight="400">2. Policing, force and institutional</text><text x="116" y="623" fill="#f5f7fb" font-family="monospace" font-size="24" font-weight="400">accountability (15)</text><text x="116" y="661" fill="#f5f7fb" font-family="monospace" font-size="24" font-weight="400">3. Corruption, capture and public money</text><text x="116" y="691" fill="#f5f7fb" font-family="monospace" font-size="24" font-weight="400">(15)</text><text x="116" y="729" fill="#f5f7fb" font-family="monospace" font-size="24" font-weight="400">4. Surveillance, secrecy and information</text><text x="116" y="759" fill="#f5f7fb" font-family="monospace" font-size="24" font-weight="400">control (10)</text><text x="116" y="797" fill="#f5f7fb" font-family="monospace" font-size="24" font-weight="400">5. Public health, science and consent</text><text x="116" y="827" fill="#f5f7fb" font-family="monospace" font-size="24" font-weight="400">(6)</text><rect x="780" y="510" width="728" height="290" rx="14" fill="#0d1016" stroke="#b78cff" stroke-width="1.5"/><text x="800" y="542" fill="#b78cff" font-family="monospace" font-size="22" font-weight="700">NOTES</text><text x="804" y="555" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">• Dashboard values are derived from the synchronized database shards.</text><text x="804" y="585" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">• Snapshot cards are generated from project text, not copied from external media.</text><text x="804" y="615" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">• A structural PASS means paths and files agree; it does not fact-check every claim.</text><text x="804" y="645" fill="#f5f7fb" font-family="monospace" font-size="22" font-weight="400">• Use the editorial queue and source index for the next human review pass.</text><text x="92" y="844" fill="#9aa4b2" font-family="monospace" font-size="16">Generated locally from project data. No external images copied.</text></svg>