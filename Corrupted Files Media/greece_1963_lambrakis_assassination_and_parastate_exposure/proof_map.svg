<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#0b0b12"/>
<rect x="30" y="30" width="1140" height="640" fill="none" stroke="#b56cff" stroke-width="3"/>
<text x="60" y="74" font-family="monospace" font-size="25" fill="#4ffff3">PROOF / SOURCE MAP</text>
<text x="60" y="106" font-family="monospace" font-size="21" fill="#e8d7ff">Lambrakis assassination and parastate exposure</text>
<text x="70" y="135" font-family="monospace" font-size="20" fill="#ffffff">1. Grigoris Lambrakis was attacked in Thessaloniki in 1963 and died after a</text><text x="70" y="162" font-family="monospace" font-size="20" fill="#ffffff">   political event.</text><text x="70" y="199" font-family="monospace" font-size="20" fill="#ffffff">2. The investigation exposed links between far-right violence, police</text><text x="70" y="226" font-family="monospace" font-size="20" fill="#ffffff">   tolerance, and parastate networks.</text><text x="70" y="263" font-family="monospace" font-size="20" fill="#ffffff">3. The central conflict is whether the state merely failed to protect him</text><text x="70" y="290" font-family="monospace" font-size="20" fill="#ffffff">   or tolerated forces around the attack.</text><text x="70" y="327" font-family="monospace" font-size="20" fill="#ffffff">4. The case matters because it became a symbol of hidden power structures</text><text x="70" y="354" font-family="monospace" font-size="20" fill="#ffffff">   inside a formal democracy.</text><text x="70" y="391" font-family="monospace" font-size="20" fill="#ffffff">5. It changed Greek political memory and remains a reference point for</text><text x="70" y="418" font-family="monospace" font-size="20" fill="#ffffff">   parastate violence.</text><text x="70" y="455" font-family="monospace" font-size="20" fill="#ffffff">6. Questions remain about how deep the network reached and how much was</text><text x="70" y="482" font-family="monospace" font-size="20" fill="#ffffff">   officially known.</text><text x="70" y="519" font-family="monospace" font-size="20" fill="#ffffff">7. Historical court and parliamentary references.</text><text x="70" y="556" font-family="monospace" font-size="20" fill="#ffffff">8. Public Greek historical record on Lambrakis case.</text>
<text x="60" y="645" font-family="monospace" font-size="16" fill="#aaaaaa">Use this as a reading map, not as standalone proof.</text>
</svg>