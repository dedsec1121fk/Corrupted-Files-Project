<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#0b0b12"/>
<rect x="30" y="30" width="1140" height="640" fill="none" stroke="#b56cff" stroke-width="3"/>
<text x="60" y="74" font-family="monospace" font-size="25" fill="#4ffff3">PROOF / SOURCE MAP</text>
<text x="60" y="106" font-family="monospace" font-size="21" fill="#e8d7ff">Citizens Commission FBI files and COINTELPRO exposure</text>
<text x="70" y="135" font-family="monospace" font-size="20" fill="#ffffff">1. Activists broke into an FBI office in Media, Pennsylvania, in 1971 and</text><text x="70" y="162" font-family="monospace" font-size="20" fill="#ffffff">   revealed files that helped expose COINTELPRO.</text><text x="70" y="199" font-family="monospace" font-size="20" fill="#ffffff">2. The files showed domestic surveillance and disruption against political</text><text x="70" y="226" font-family="monospace" font-size="20" fill="#ffffff">   groups, civil-rights movements, and dissent networks.</text><text x="70" y="263" font-family="monospace" font-size="20" fill="#ffffff">3. The key conflict is whether security agencies can secretly police lawful</text><text x="70" y="290" font-family="monospace" font-size="20" fill="#ffffff">   political activity without destroying democracy.</text><text x="70" y="327" font-family="monospace" font-size="20" fill="#ffffff">4. The case matters because it transformed abstract fears of surveillance</text><text x="70" y="354" font-family="monospace" font-size="20" fill="#ffffff">   into documents people could read.</text><text x="70" y="391" font-family="monospace" font-size="20" fill="#ffffff">5. It produced long-term distrust of intelligence power and helped push</text><text x="70" y="418" font-family="monospace" font-size="20" fill="#ffffff">   later oversight reforms.</text><text x="70" y="455" font-family="monospace" font-size="20" fill="#ffffff">6. Open questions remain about how much similar activity continues under</text><text x="70" y="482" font-family="monospace" font-size="20" fill="#ffffff">   different legal names.</text><text x="70" y="519" font-family="monospace" font-size="20" fill="#ffffff">7. FBI Vault COINTELPRO records.</text><text x="70" y="556" font-family="monospace" font-size="20" fill="#ffffff">8. Church Committee historical record.</text>
<text x="60" y="645" font-family="monospace" font-size="16" fill="#aaaaaa">Use this as a reading map, not as standalone proof.</text>
</svg>