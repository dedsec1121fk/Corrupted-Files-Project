<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#0b0b12"/>
<rect x="30" y="30" width="1140" height="640" fill="none" stroke="#b56cff" stroke-width="3"/>
<text x="60" y="74" font-family="monospace" font-size="25" fill="#4ffff3">PROOF / SOURCE MAP</text>
<text x="60" y="106" font-family="monospace" font-size="21" fill="#e8d7ff">MOVE bombing in Philadelphia</text>
<text x="70" y="135" font-family="monospace" font-size="20" fill="#ffffff">1. In 1985 Philadelphia police dropped an explosive on a house occupied by</text><text x="70" y="162" font-family="monospace" font-size="20" fill="#ffffff">   MOVE members.</text><text x="70" y="199" font-family="monospace" font-size="20" fill="#ffffff">2. The resulting fire killed adults and children and destroyed dozens of</text><text x="70" y="226" font-family="monospace" font-size="20" fill="#ffffff">   homes.</text><text x="70" y="263" font-family="monospace" font-size="20" fill="#ffffff">3. The central conflict is how a city converted a policing operation into a</text><text x="70" y="290" font-family="monospace" font-size="20" fill="#ffffff">   neighborhood catastrophe.</text><text x="70" y="327" font-family="monospace" font-size="20" fill="#ffffff">4. It matters because state force, racial politics, and urban governance</text><text x="70" y="354" font-family="monospace" font-size="20" fill="#ffffff">   collided in one visible disaster.</text><text x="70" y="391" font-family="monospace" font-size="20" fill="#ffffff">5. Public trust collapsed because the event looked less like law</text><text x="70" y="418" font-family="monospace" font-size="20" fill="#ffffff">   enforcement and more like war against residents.</text><text x="70" y="455" font-family="monospace" font-size="20" fill="#ffffff">6. Questions remain over command decisions, fire response, and</text><text x="70" y="482" font-family="monospace" font-size="20" fill="#ffffff">   accountability.</text><text x="70" y="519" font-family="monospace" font-size="20" fill="#ffffff">7. Philadelphia Special Investigation Commission materials.</text><text x="70" y="556" font-family="monospace" font-size="20" fill="#ffffff">8. Public historical reporting and city records.</text>
<text x="60" y="645" font-family="monospace" font-size="16" fill="#aaaaaa">Use this as a reading map, not as standalone proof.</text>
</svg>